services:
  auth-service:
    image: auth-service:1
    build: 
      context: ./services/auth-service/
      dockerfile : Dockerfile.dev
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      mongodb:
        condition: service_healthy
    restart : unless-stopped
    volumes:
      - ./services/auth-service:/opt/e-commerce/services/auth-service
      - auth-node-modules:/opt/e-commerce/services/auth-service/node_modules
    networks:
      - e-commerce-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    image: order-service:1
    build: 
      context: ./services/order-service/
      dockerfile : Dockerfile.dev
    container_name: order-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      mongodb:
        condition: service_healthy
    restart : unless-stopped
    volumes:
      - ./services/order-service:/opt/e-commerce/services/order-service
      - order-node-modules:/opt/e-commerce/services/order-service/node_modules
    networks:
      - e-commerce-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-service:
    image: product-service:1
    build: 
      context: ./services/product-service/
      dockerfile : Dockerfile.dev
    container_name: product-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      mongodb:
        condition: service_healthy
    restart : unless-stopped
    volumes:
      - ./services/product-service:/opt/e-commerce/services/product-service
      - product-node-modules:/opt/e-commerce/services/product-service/node_modules
    networks:
      - e-commerce-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: frontend:1
    build: 
      context: ./frontend/
      dockerfile : Dockerfile.dev
    container_name: frontend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - product-service
      - auth-service
      - order-service
    restart : unless-stopped
    networks:
      - e-commerce-app
  
  mongodb:
    image: mongo:8.2.5
    hostname: mongodb
    container_name : mongodb
    ports:
      - 27017:27017
    volumes:
      - db:/data/db
    restart : unless-stopped
    networks:
      - e-commerce-app
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db:
  auth-node-modules:
  order-node-modules:
  product-node-modules:

networks:
  e-commerce-app:
    driver: bridge
